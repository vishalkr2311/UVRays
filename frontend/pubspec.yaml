name: blindmeet
description: BlindMeet - Dark Fantasy Dating App with Real-time Chat
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # HTTP & Networking
  dio: ^5.3.0
  socket_io_client: ^2.0.0

  # Authentication & Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  google_sign_in: ^6.2.0
  firebase_storage: ^11.5.0

  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0

  # UI & Animations
  glassmorphism: ^3.0.0
  flutter_animate: ^4.2.0
  lottie: ^2.7.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.0

  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.0
  image_picker: ^1.0.0
  image_compression: ^1.0.0
  permission_handler: ^11.4.0
  geolocator: ^9.0.0

  # UI Components
  cupertino_icons: ^1.0.0
  cached_network_image: ^3.3.0
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
